<!DOCTYPE html>
<html>
<head>

<title>Water Monitoring Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
}

.container{
margin-top:50px;
}

.tank{

width:220px;
height:400px;
border:5px solid white;
margin:auto;
position:relative;
overflow:hidden;
border-radius:20px;
}

.water{

width:100%;
height:0%;
position:absolute;
bottom:0;
background:linear-gradient(#38bdf8,#0284c7);
transition:1s;
}

.card{

padding:20px;
background:#1e293b;
width:300px;
margin:auto;
margin-top:30px;
border-radius:15px;
}

</style>

</head>

<body>

<div class="container">

<h1>Smart Water Level Dashboard</h1>

<div class="tank">
<div class="water" id="water"></div>
</div>

<div class="card">
<h2 id="status">Loading...</h2>
<h3 id="value">0</h3>
</div>

</div>

<script>

const firebaseConfig={

apiKey:"YAIzaSyBzJkbjHWq-Gj1MbCMa6aQ3Fn_KZzrARIY",
databaseURL:"https://water-level-iot-90f57-default-rtdb.asia-southeast1.firebasedatabase.app"

};

firebase.initializeApp(firebaseConfig);

let ref=firebase.database().ref("tank");

ref.on("value",(snapshot)=>{

let data=snapshot.val();

document.getElementById("status").innerHTML=
"Tank Status : "+data.status;

document.getElementById("value").innerHTML=
"Sensor Value : "+data.waterLevel;

let level=(data.waterLevel/1023)*100;

document.getElementById("water").style.height=
level+"%";

});

</script>

</body>
</html>
